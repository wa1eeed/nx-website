<svg viewBox="0 0 120 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ساعة إيقاف">
  <defs>
    <linearGradient id="swSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/><stop offset=".18" stop-color="#B9C2CC"/>
      <stop offset=".38" stop-color="#EDF0F3"/><stop offset=".58" stop-color="#8D98A5"/>
      <stop offset=".78" stop-color="#D7DDE4"/><stop offset="1" stop-color="#7E8A97"/>
    </linearGradient>
    <linearGradient id="swSteel2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8D98A5"/><stop offset=".35" stop-color="#E9EDF1"/>
      <stop offset=".7" stop-color="#A6B0BB"/><stop offset="1" stop-color="#DDE3E9"/>
    </linearGradient>
    <radialGradient id="swDial" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".72" stop-color="#FAFBFC"/>
      <stop offset="1" stop-color="#E4E8ED"/>
    </radialGradient>
    <linearGradient id="swGlass" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ring loop -->
  <g fill="none" stroke="url(#swSteel)" stroke-width="4.6">
    <ellipse cx="60" cy="9.5" rx="9.6" ry="8.4"/>
  </g>
  <!-- crown -->
  <path d="M52.4 18h15.2l-1.5 10.6H53.9z" fill="url(#swSteel2)"/>
  <g stroke="#8B96A3" stroke-width=".7" opacity=".75">
    <path d="M55 18.6v9.4M58 18.6v9.4M61 18.6v9.4M64 18.6v9.4"/>
  </g>
  <rect x="50.6" y="27.4" width="18.8" height="5.4" rx="2" fill="url(#swSteel)"/>

  <!-- pushers -->
  <g fill="url(#swSteel2)">
    <path d="M26.6 30.2l8.6-5 6.4 11-8.6 5z" transform="rotate(-6 34 33)"/>
    <path d="M93.4 30.2l-8.6-5-6.4 11 8.6 5z" transform="rotate(6 86 33)"/>
  </g>

  <!-- case -->
  <circle cx="60" cy="80" r="45" fill="url(#swSteel)"/>
  <circle cx="60" cy="80" r="40.5" fill="url(#swSteel2)"/>
  <circle cx="60" cy="80" r="36.5" fill="#6F7B89"/>
  <circle cx="60" cy="80" r="35.4" fill="url(#swDial)"/>

  <!-- ticks: 60 minor, every 5th major -->
  <g stroke="#2A2F36">
    <g stroke-width="1" opacity=".8">
      <!-- generated ring of minor ticks -->
      <path d="M60 46.4v2.6M63.5 46.6l-.3 2.6M67 47l-.5 2.6M70.4 47.7l-.7 2.5M73.7 48.6l-.9 2.4M76.9 49.8l-1.1 2.4M80 51.2l-1.3 2.2M83 52.9l-1.5 2.2M85.8 54.8l-1.6 2M88.4 57l-1.8 1.9M90.8 59.3l-1.9 1.7M93 61.9l-2.1 1.5M94.9 64.6l-2.2 1.3M96.5 67.5l-2.3 1.1M97.9 70.4l-2.4.9M98.9 73.5l-2.5.7M99.6 76.6l-2.6.5M100 79.8l-2.6.2"/>
      <path d="M60 46.4v2.6M56.5 46.6l.3 2.6M53 47l.5 2.6M49.6 47.7l.7 2.5M46.3 48.6l.9 2.4M43.1 49.8l1.1 2.4M40 51.2l1.3 2.2M37 52.9l1.5 2.2M34.2 54.8l1.6 2M31.6 57l1.8 1.9M29.2 59.3l1.9 1.7M27 61.9l2.1 1.5M25.1 64.6l2.2 1.3M23.5 67.5l2.3 1.1M22.1 70.4l2.4.9M21.1 73.5l2.5.7M20.4 76.6l2.6.5M20 79.8l2.6.2"/>
      <path d="M100 80.2l-2.6-.2M99.6 83.4l-2.6-.5M98.9 86.5l-2.5-.7M97.9 89.6l-2.4-.9M96.5 92.5l-2.3-1.1M94.9 95.4l-2.2-1.3M93 98.1l-2.1-1.5M90.8 100.7l-1.9-1.7M88.4 103l-1.8-1.9M85.8 105.2l-1.6-2M83 107.1l-1.5-2.2M80 108.8l-1.3-2.2M76.9 110.2l-1.1-2.4M73.7 111.4l-.9-2.4M70.4 112.3l-.7-2.5M67 113l-.5-2.6M63.5 113.4l-.3-2.6M60 113.6V111"/>
      <path d="M20 80.2l2.6-.2M20.4 83.4l2.6-.5M21.1 86.5l2.5-.7M22.1 89.6l2.4-.9M23.5 92.5l2.3-1.1M25.1 95.4l2.2-1.3M27 98.1l2.1-1.5M29.2 100.7l1.9-1.7M31.6 103l1.8-1.9M34.2 105.2l1.6-2M37 107.1l1.5-2.2M40 108.8l1.3-2.2M43.1 110.2l1.1-2.4M46.3 111.4l.9-2.4M49.6 112.3l.7-2.5M53 113l.5-2.6M56.5 113.4l.3-2.6"/>
    </g>
    <g stroke-width="1.9">
      <path d="M60 46.4v4.4M77.3 51.1l-2.2 3.8M89.9 63.7l-3.8 2.2M94.6 81h-4.4M89.9 98.3l-3.8-2.2M77.3 110.9l-2.2-3.8M60 115.6v-4.4M42.7 110.9l2.2-3.8M30.1 98.3l3.8-2.2M25.4 81h4.4M30.1 63.7l3.8 2.2M42.7 51.1l2.2 3.8"/>
    </g>
  </g>

  <!-- numerals: red at 60/15/30/45, dark elsewhere -->
  <g font-family="Arial,'Helvetica Neue',sans-serif" font-weight="700" text-anchor="middle">
    <g font-size="9.4" fill="#0A1A2F">
      <text x="77.9" y="58.2">5</text><text x="88.4" y="70.1">10</text>
      <text x="88.4" y="94.4">20</text><text x="77.9" y="106.3">25</text>
      <text x="42.1" y="106.3">35</text><text x="31.6" y="94.4">40</text>
      <text x="31.6" y="70.1">50</text><text x="42.1" y="58.2">55</text>
    </g>
    <g font-size="10" fill="#C62828">
      <text x="60" y="55.6">60</text><text x="92.3" y="85.4">15</text>
      <text x="60" y="110.4">30</text><text x="27.7" y="85.4">45</text>
    </g>
  </g>

  <!-- 30-minute sub-dial -->
  <circle cx="60" cy="68.5" r="10.4" fill="#F3F5F7" stroke="#B4BDC7" stroke-width=".8"/>
  <g stroke="#5A6472" stroke-width=".7">
    <path d="M60 59.2v1.8M69.3 68.5h-1.8M60 77.8V76M50.7 68.5h1.8M66.6 61.9l-1.3 1.3M66.6 75.1l-1.3-1.3M53.4 75.1l1.3-1.3M53.4 61.9l1.3 1.3"/>
  </g>
  <g font-family="Arial,'Helvetica Neue',sans-serif" font-size="3.6" fill="#39424E" text-anchor="middle">
    <text x="60" y="63.1">30</text><text x="67" y="69.6">5</text>
    <text x="64.6" y="75.6">10</text><text x="60" y="77.4">15</text>
    <text x="55.4" y="75.6">20</text><text x="53" y="69.6">25</text>
  </g>
  <path d="M60 68.5V61" stroke="#C62828" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="60" cy="68.5" r="1.3" fill="#C62828"/>

  <!-- lower fan gauge -->
  <path d="M47.6 96.6a13 13 0 0 1 24.8 0z" fill="#FFFFFF" stroke="#B4BDC7" stroke-width=".8"/>
  <path d="M60 96.6l-9.6-3.4" stroke="#C62828" stroke-width="1.3" stroke-linecap="round"/>

  <!-- sweep hand -->
  <path d="M59 79l-1.4 2.6 2.4 1.4 26.6-17z" fill="#D32F2F"/>
  <circle cx="60" cy="81" r="3.4" fill="#C62828"/>
  <circle cx="60" cy="81" r="1.2" fill="#FFFFFF" opacity=".55"/>

  <!-- glass highlight -->
  <circle cx="60" cy="80" r="35.4" fill="url(#swGlass)" style="pointer-events:none"/>
</svg>
